<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 300px;
            padding: 16px;
            margin: 0;
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f9f9f9;
            color: #333;
        }

        .header {
            margin-bottom: 12px;
        }

        .status-label {
            font-weight: 600;
            font-size: 14px;
        }

        hr {
            border: 0;
            height: 1px;
            background: #e5e5e5;
            margin: 0 0 12px 0;
        }

        .label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .site-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            display: none;
        }

        .badge.visible {
            display: inline-block;
        }

        .success {
            background: #d1fae5;
            color: #065f46;
        }

        .warning {
            background: #f3f4f6;
            color: #6b7280;
        }

        .footer {
            margin-top: 16px;
        }

        .link {
            color: #2563eb;
            text-decoration: none;
            font-size: 13px;
            cursor: pointer;
            border: none;
            background: none;
            padding: 0;
        }

        .link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="header">
        <span class="status-label">Captcha Helper</span>
    </div>

    <hr>

    <div>
        <div class="label">[ Current Site ]</div>
        <div id="siteName" class="site-name">Checking...</div>

        <div id="badge-active" class="badge success">Active</div>
        <div id="badge-unsupported" class="badge warning">Inactive (Not supported)</div>
    </div>

    <div class="footer">
        <div class="label">[ Logs link ]</div>
        <button id="logsBtn" class="link">View activity ➜</button>
    </div>

    <script src="popup.js"></script>
</body>

</html>
